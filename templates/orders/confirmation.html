{% extends 'base.html' %}

{% block content %}
<div class="confirmation-page">
    <div class="success-box">
        <svg viewBox="0 0 24 24" width="60" height="60" class="success-icon"><path fill="#067D62" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <h2>Order placed, thanks!</h2>
        <p>Confirmation will be sent to your email.</p>
        <div class="order-details">
            <p><strong>Order Number:</strong> #{{ order.id }}</p>
            <p><strong>Total:</strong> ₹{{ order.total_amount }}</p>
            <p><strong>Payment Method:</strong> {{ order.get_payment_method_display }}</p>
        </div>
        <a href="{% url 'products:home' %}" class="btn btn-secondary">Continue Shopping</a>
        <a href="{% url 'orders:order_history' %}" class="btn">View Orders</a>
    </div>
</div>
{% endblock %}

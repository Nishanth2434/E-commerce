{% extends 'base.html' %}

{% block content %}
<div class="profile-page">
    <div class="profile-sidebar">
        <h3>Hello, {{ user.first_name }}</h3>
        <nav class="profile-nav">
            <a href="{% url 'orders:order_history' %}">Your Orders</a>
            <a href="{% url 'accounts:profile' %}" class="active">Login & security</a>
        </nav>
    </div>
    <div class="profile-main">
        <h2>Login & security</h2>
        <div class="profile-card">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="full_name">Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ user.first_name }}">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}">
                </div>
                <div class="form-group">
                    <label for="phone">Mobile Phone Number</label>
                    <input type="text" id="phone" name="phone" value="{{ profile.phone }}">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3">{{ profile.address }}</textarea>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" value="{{ profile.city }}">
                </div>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

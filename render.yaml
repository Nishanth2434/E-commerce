databases:
  - name: shophub_db
    databaseName: shophub
    user: shophub
    plan: free

services:
  - type: web
    name: shophub
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn shophub.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shophub_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 4
